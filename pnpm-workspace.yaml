packages:
  - apps/*
  - packages/*
  - tools/*

# Versions shared by several packages. Reference them as "catalog:" in package.json.
catalog:
  typescript: ~6.0.3 # not 7.x: typescript-eslint 8.71 requires typescript < 6.1
  vitest: ^5.0.2
  "@types/node": ^24.0.0 # match the Node 24 runtime, not the latest types (26.x)

# Supply-chain guard: never install a version published less than 24 h ago.
minimumReleaseAge: 1440
